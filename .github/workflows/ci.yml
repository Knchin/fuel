name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14'

      - name: Compile shared KMP (JS target)
        run: gradle shared:compileKotlinJs --no-build-cache

      - name: Compile shared tests
        run: gradle shared:compileTestKotlinJs --no-build-cache

      - name: Compile androidApp (JVM stub)
        run: gradle androidApp:compileKotlin --no-build-cache

      - name: Build web distribution
        run: gradle webApp:browserProductionWebpack --no-build-cache

      - name: Upload web distribution
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: webApp/build/distributions/
          retention-days: 30

  cloudflare-deploy:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download web distribution
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Generate config.js from secrets
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY not configured."
            exit 1
          fi
          cat > web-dist/config.js <<'EOF'
// Generated at deploy time from GitHub secrets/vars
window.FUEL_CONFIG = {
  SUPABASE_URL: "$SUPABASE_URL",
  SUPABASE_ANON_KEY: "$SUPABASE_ANON_KEY"
};
EOF
          echo "Generated config.js:"
          cat web-dist/config.js

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          set -eo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID variable is not set."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_PROJECT_NAME" ]; then
            echo "::error::CLOUDFLARE_PROJECT_NAME variable is not set."
            exit 1
          fi
          wrangler pages project create "$CLOUDFLARE_PROJECT_NAME" --production-branch=main || echo "Project may already exist, continuing..."
          wrangler pages deploy web-dist --project-name="$CLOUDFLARE_PROJECT_NAME" --branch=main

