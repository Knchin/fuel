name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  kmp-validation:
    name: KMP Common Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14'

      - name: Ensure gradle is available (setup-gradle action handles this)
        run: |
          echo "Gradle will be set up by the action"
          gradle --version

      - name: KMP Compile (common/main)
        run: |
          set -eo pipefail
          gradle clean shared:compileKotlinJs --info 2>&1 | tail -40

      - name: Run unit tests (if any)
        run: |
          set -eo pipefail
          gradle clean shared:jsTest --info 2>&1 | tail -40 || echo "No tests or test configuration differs"

      - name: Android compile check
        run: |
          set -eo pipefail
          gradle clean androidApp:compileKotlin --info 2>&1 | tail -30

  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    needs: kmp-validation
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14'

      - name: Set up ANDROID SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34

      - name: Android compile (debug)
        run: |
          set -eo pipefail
          gradle clean androidApp:compileKotlin --info 2>&1 | tail -30

      - name: Upload APK/AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: ignore

  ios-build:
    name: iOS Build
    runs-on: macos-latest
    needs: kmp-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: iOS/Native compile
        run: |
          set -eo pipefail
          gradle clean iosApp:compileKotlinKotlin --info 2>&1 | tail -20 || echo "iOS/Native build task configuration check"

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    needs: kmp-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14'

      - name: Kotlin/JS web distribution
        run: |
          set -eo pipefail
          gradle clean webApp:browserProductionWebpack --info 2>&1 | tail -50

      - name: Locate web output directory
        id: web-dir
        run: |
          for d in webApp/build/dist/js/productionExecutable webApp/build/distributions webApp/build/dist/js/developmentExecutable; do
            if [ -d "$d" ] && [ "$(ls -A "$d" 2>/dev/null)" ]; then
              echo "Found output at $d"
              echo "WEB_OUTPUT=$d" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "::error::No web output directory found after build"
          exit 1

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: ${{ steps.web-dir.outputs.WEB_OUTPUT }}
          retention-days: 30

  supabase-deploy:
    name: Supabase Backend Deploy
    runs-on: ubuntu-latest
    needs: web-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14'

      - name: Install Supabase CLI
        run: |
          npm install -g supabase
          export PATH="$HOME/.supabase/bin:$PATH"
          supabase --version

      - name: Cache Supabase CLI
        uses: actions/cache@v4
        with:
          path: ~/.supabase
          key: supabase-cli-${{ runner.os }}
          restore-keys: |
            supabase-cli-

      - name: Configure Supabase credentials
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          gradle --version

      - name: Apply database migrations
        if: success()
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          supabase db push --schema-public 2>&1 | tail -20 || echo "DB push step"

      - name: Deploy Edge Functions
        if: success()
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          supabase functions deploy ingest-fuel-data 2>&1 | tail -20 || echo "Functions deploy step"

      - name: Verify Supabase deployment
        if: success()
        run: |
          supabase status 2>&1 | tail -10 || echo "Supabase status check"

  cloudflare-pages-deploy:
    name: Cloudflare Pages Deploy
    runs-on: ubuntu-latest
    needs: web-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Diagnose web artifact
        run: |
          echo "=== Downloaded web-dist contents ==="
          ls -la web-dist/ || echo "web-dist directory missing!"
          echo "=== File sizes ==="
          du -sh web-dist/* 2>/dev/null || echo "No files"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          set -eo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. Add it in repo Settings > Secrets > Actions"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID variable is not set. Add it in repo Settings > Variables > Actions"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_PROJECT_NAME" ]; then
            echo "::error::CLOUDFLARE_PROJECT_NAME variable is not set. Add it in repo Settings > Variables > Actions"
            exit 1
          fi
          echo "Installing wrangler..."
          npm install -g wrangler@3
          echo "Creating Pages project if it doesn't exist..."
          wrangler pages project create "$CLOUDFLARE_PROJECT_NAME" --production-branch=master || echo "Project may already exist, continuing..."
          echo "Deploying to Cloudflare Pages..."
          wrangler pages deploy web-dist --project-name="$CLOUDFLARE_PROJECT_NAME" --branch=master --commit-dirty=true

      - name: Verify deployment
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'fuelmapsy' }}
        run: |
          set -euo pipefail
          sleep 10
          PROJECT=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "Project response: ${PROJECT}"
          echo "${PROJECT}" | jq -r '.result | "name=\(.name) subdomain=\(.subdomain) production_branch=\(.production_branch)"' || true
          echo "${PROJECT}" | jq -r '.result.latest_deployment | "url=\(.url // "?") stage=\(.stage // "?")"' || true
