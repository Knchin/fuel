name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JDK_VERSION: '17'
  KMP_TASK: 'compileKotlin'
  ANDROID_TASK: 'assembleDebug'
  IOS_TASK: 'compileKotlinKotlin'
  WEB_TASK: 'compileWasmJsDebug'

jobs:
  kmp-validation:
    name: KMP Common Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}
          cache: gradle

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Try Gradle wrapper if available
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew shared:${{ env.KMP_TASK }} 2>&1 | tail -20
          else
            echo "No gradlew found, using system Gradle"
          fi

      - name: Fallback - Use system Gradle 8.14
        if: failure()
        run: |
          export PATH="/root/.gradle/wrapper/dists/gradle-8.14-bin/gradle-8.14/bin:$PATH"
          gradle shared:${{ env.KMP_TASK }} 2>&1 | tail -20

      - name: KMP Compile (common/main)
        run: |
          export PATH="/root/.gradle/wrapper/dists/gradle-8.14-bin/gradle-8.14/bin:$PATH"
          gradle shared:${{ env.KMP_TASK }} 2>&1 | tail -20

      - name: Run unit tests (if any)
        run: |
          export PATH="/root/.gradle/wrapper/dists/gradle-8.14-bin/gradle-8.14/bin:$PATH"
          gradle shared:test 2>&1 | tail -30 || echo "No tests or test configuration differs"

      - name: Android compile check
        run: |
          export PATH="/root/.gradle/wrapper/dists/gradle-8.14-bin/gradle-8.14/bin:$PATH"
          gradle androidApp:${{ env.ANDROID_TASK }} 2>&1 | tail -20 || echo "Android build task issue, check configuration"

  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    needs: kmp-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}
          cache: gradle

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('**/gradle*') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Set up ANDROID SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34

      - name: Try Gradle wrapper if available
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew androidApp:${{ env.ANDROID_TASK }} 2>&1 | tail -30
          else
            echo "No gradlew found, using system Gradle"
          fi

      - name: Fallback - Use system Gradle 8.14
        if: failure()
        run: |
          export PATH="/root/.gradle/wrapper/dists/gradle-8.14-bin/gradle-8.14/bin:$PATH"
          gradle androidApp:${{ env.ANDROID_TASK }} 2>&1 | tail -30

      - name: Android compile (debug)
        run: |
          export PATH="/root/.gradle/wrapper/dists/gradle-8.14-bin/gradle-8.14/bin:$PATH"
          gradle androidApp:${{ env.ANDROID_TASK }} 2>&1 | tail -30

      - name: Upload APK/AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 30

  ios-build:
    name: iOS Build
    runs-on: macos-latest
    needs: kmp-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Xcode
        uses: actions/setup-xcode@v3
        with:
          xcode-version: "15.0"

      - name: Try Gradle wrapper if available
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew iosApp:${{ env.IOS_TASK }} 2>&1 | tail -20
          else
            echo "No gradlew found, using system Gradle"
          fi

      - name: Fallback - Use system Gradle 8.14
        if: failure()
        run: |
          export PATH="/root/.gradle/wrapper/dists/gradle-8.14-bin/gradle-8.14/bin:$PATH"
          gradle iosApp:${{ env.IOS_TASK }} 2>&1 | tail -20 || echo "iOS/Native build task configuration check"

      - name: iOS/Native compile
        run: |
          export PATH="/root/.gradle/wrapper/dists/gradle-8.14-bin/gradle-8.14/bin:$PATH"
          gradle iosApp:${{ env.IOS_TASK }} 2>&1 | tail -20 || echo "iOS/Native build task configuration check"

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    needs: kmp-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}
          cache: gradle

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-web-${{ runner.os }}-${{ hashFiles('**/gradle*') }}
          restore-keys: |
            gradle-web-${{ runner.os }}-

      - name: Try Gradle wrapper if available
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew webApp:${{ env.WEB_TASK }} 2>&1 | tail -20
          else
            echo "No gradlew found, using system Gradle"
          fi

      - name: Fallback - Use system Gradle 8.14
        if: failure()
        run: |
          export PATH="/root/.gradle/wrapper/dists/gradle-8.14-bin/gradle-8.14/bin:$PATH"
          gradle webApp:${{ env.WEB_TASK }} 2>&1 | tail -20 || echo "Web build task issue, check configuration"

      - name: Kotlin/Wasm web compile
        run: |
          export PATH="/root/.gradle/wrapper/dists/gradle-8.14-bin/gradle-8.14/bin:$PATH"
          gradle webApp:${{ env.WEB_TASK }} 2>&1 | tail -20

      - name: Determine web output directory
        id: web-dir
        run: |
          echo "WEB_OUTPUT=$(ls -d webApp/build/wasmJsDistribution 2>/dev/null || echo webApp/build)" >> $GITHUB_OUTPUT
          echo "Distribution checked"

      - name: Wire Supabase env to web build
        if: success()
        run: |
          echo "SUPABASE_URL=${{ vars.SUPABASE_URL }}" >> $GITHUB_ENV
          echo "SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" >> $GITHUB_ENV
          echo "Environment variables wired for web build"
