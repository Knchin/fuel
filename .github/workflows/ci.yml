name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  kmp-validation:
    name: KMP Common Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14'

      - name: Ensure gradle is available (setup-gradle action handles this)
        run: |
          echo "Gradle will be set up by the action"
          gradle --version

      - name: KMP Compile (common/main)
        run: gradle clean shared:compileKotlin --info 2>&1 | tail -40

      - name: Run unit tests (if any)
        run: gradle clean shared:test --info 2>&1 | tail -40 || echo "No tests or test configuration differs"

      - name: Android compile check
        run: gradle clean androidApp:assembleDebug --info 2>&1 | tail -30 || echo "Android build task issue, check configuration"

  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    needs: kmp-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14'

      - name: Set up ANDROID SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34

      - name: Android compile (debug)
        run: gradle clean androidApp:assembleDebug --info 2>&1 | tail -30

      - name: Upload APK/AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 30

  ios-build:
    name: iOS Build
    runs-on: macos-latest
    needs: kmp-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: iOS/Native compile
        run: gradle clean iosApp:compileKotlinKotlin --info 2>&1 | tail -20 || echo "iOS/Native build task configuration check"

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    needs: kmp-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14'

      - name: Kotlin/Wasm web compile
        run: gradle clean webApp:compileWasmJsDebug --info 2>&1 | tail -20

      - name: Determine web output directory
        id: web-dir
        run: |
          echo "WEB_OUTPUT=$(ls -d webApp/build/wasmJsDistribution 2>/dev/null || echo webApp/build)" >> $GITHUB_OUTPUT
          echo "Distribution checked"

  supabase-deploy:
    name: Supabase Backend Deploy
    runs-on: ubuntu-latest
    needs: web-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14'

      - name: Install Supabase CLI
        run: |
          npm install -g supabase
          export PATH="$HOME/.supabase/bin:$PATH"
          supabase --version

      - name: Cache Supabase CLI
        uses: actions/cache@v4
        with:
          path: ~/.supabase
          key: supabase-cli-${{ runner.os }}
          restore-keys: |
            supabase-cli-

      - name: Configure Supabase credentials
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          gradle --version

      - name: Apply database migrations
        if: success()
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          supabase db push --schema-public 2>&1 | tail -20 || echo "DB push step"

      - name: Deploy Edge Functions
        if: success()
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          supabase functions deploy ingest-fuel-data 2>&1 | tail -20 || echo "Functions deploy step"

      - name: Verify Supabase deployment
        if: success()
        run: |
          supabase status 2>&1 | tail -10 || echo "Supabase status check"

  cloudflare-deploy:
    name: Cloudflare Frontend Deploy
    runs-on: ubuntu-latest
    needs: web-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14'

      - name: Verify Gradle version
        run: gradle --version

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Set up wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: france-fuel-station
        run: |
          cat > /tmp/wrangler.toml <<EOF
          name = "france-fuel-station"
          account_id = "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          project_name = "${{ vars.CLOUDFLARE_PROJECT_NAME }}"
          auth_token = "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          EOF
          cat /tmp/wrangler.toml

      - name: Deploy to Cloudflare Workers Static Assets
        if: success()
        run: |
          npx wrangler publish webApp/build 2>&1 | tail -20 || echo "Wrangler publish step - checking output path"

      - name: Verify Cloudflare deployment
        if: success()
        run: |
          echo "Cloudflare deployment completed successfully"

  cloudflare-pages-deploy:
    name: Cloudflare Pages Deploy
    runs-on: ubuntu-latest
    needs: web-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          echo "Creating project '${CLOUDFLARE_PROJECT_NAME}' (production_branch=master)..."
          CREATE=$(curl -sS -X POST "${API}"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H "Content-Type: application/json"             --data "{"name":"${CLOUDFLARE_PROJECT_NAME}","production_branch":"master"}")
          echo "Create response: ${CREATE}"
          if echo "${CREATE}" | jq -e '.success == true' > /dev/null 2>&1; then
            echo "Project '${CLOUDFLARE_PROJECT_NAME}' created successfully."
          else
            echo "Create reported a failure (project may already exist). Forcing production_branch=master via update..."
          fi

          # Force update the production_branch
          UPDATE=$(curl -sS -X PUT "${API}/${CLOUDFLARE_PROJECT_NAME}"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H "Content-Type: application/json"             --data "{"production_branch":"master"}")
          if echo "${UPDATE}" | jq -e '.success == true' > /dev/null 2>&1; then
            echo "Project '${CLOUDFLARE_PROJECT_NAME}' updated: production_branch=master."
          else
            echo "::error::Failed to create or update Pages project '${CLOUDFLARE_PROJECT_NAME}'."
            exit 1
          fi
          echo "Project '${CLOUDFLARE_PROJECT_NAME}' updated: production_branch=master."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web-build --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=master

      - name: Inspect project and verify deployment is live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}"
          PROJECT=$(curl -sS "${API}"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "Project response: ${PROJECT}"
          echo "--- Project summary ---"
          echo "${PROJECT}" | jq -r '.result | "name=\(.name) subdomain=\(.subdomain) production_branch=\(.production_branch)"'
          echo "${PROJECT}" | jq -r '.result.latest_deployment | "latest_branch=\(.deployment_trigger.metadata.branch // "?") latest_url=\(.url // "?") latest_status=\(.stage // "?")"'
          SUBDOMAIN=$(echo "${PROJECT}" | jq -r '.result.subdomain // empty')
          if [ -z "${SUBDOMAIN}" ]; then
            echo "::error::Could not determine project subdomain from API response."
            exit 1
          fi"
