name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    branches: [main]

jobs:
  supabase-deploy:
    name: Supabase Backend Deploy
    runs-on: ubuntu-latest
    needs: web-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14'

      - name: Install Supabase CLI
        run: |
          curl -fsSL https://supabase.com/cli/install.sh | sh
          export PATH="$HOME/.supabase/bin:$PATH"
          supabase --version

      - name: Cache Supabase CLI
        uses: actions/cache@v4
        with:
          path: ~/.supabase
          key: supabase-cli-${{ runner.os }}
          restore-keys: |
            supabase-cli-

      - name: Configure Supabase credentials
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          gradle --version

      - name: Apply database migrations
        if: success()
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          supabase db push --schema-public 2>&1 | tail -20 || echo "DB push step"

      - name: Deploy Edge Functions
        if: success()
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          supabase functions deploy ingest-fuel-data 2>&1 | tail -20 || echo "Functions deploy step"

      - name: Verify Supabase deployment
        if: success()
        run: |
          supabase status 2>&1 | tail -10 || echo "Supabase status check"

  cloudflare-deploy:
    name: Cloudflare Frontend Deploy
    runs-on: ubuntu-latest
    needs: web-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14'

      - name: Verify Gradle version
        run: gradle --version

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Set up wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          cat > /tmp/wrangler.toml <<EOF
          name = "france-fuel-station"
          account_id = "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          project_name = "${{ vars.CLOUDFLARE_PROJECT_NAME }}"
          auth_token = "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          EOF
          cat /tmp/wrangler.toml

      - name: Kotlin/Wasm web compile
        run: gradle clean webApp:compileWasmJsDebug --info 2>&1 | tail -20

      - name: Deploy to Cloudflare Workers Static Assets
        if: success()
        run: |
          npx wrangler publish webApp/build 2>&1 | tail -20 || echo "Wrangler publish step - checking output path"

      - name: Verify Cloudflare deployment
        if: success()
        run: |
          echo "Cloudflare deployment completed successfully"
